        .option-item.correct{background:rgba(16,185,129,0.1);border-color:#10b981}
        .option-item.incorrect{background:rgba(239,68,68,0.1);border-color:#ef4444}
        .badge{width:2.5rem;height:2.5rem;min-width:2.5rem;border-radius:9999px;background:#374151;color:#d1d5db;display:flex;align-items:center;justify-content:center;font-size:0.9rem;font-weight:700;flex-shrink:0}
        .option-item.selected .badge{background:#3b82f6;color:#ffffff}
        .option-item.correct .badge{background:#10b981;color:#ffffff}
        .option-item.incorrect .badge{background:#ef4444;color:#ffffff}
        .option-text{color:#e5e7eb;font-size:1.05rem;line-height:1.7;flex:1;word-break:break-word;overflow-wrap:break-word}
        .feedback{margin-top:2rem;padding:1.5rem;border-radius:1rem;font-size:1rem;line-height:1.6;display:flex;align-items:flex-start;gap:1rem;animation:fadeIn 0.3s ease both;word-break:break-word;overflow-wrap:break-word}
        @keyframes fadeIn{from{opacity:0}to{opacity:1}}
        .feedback-success{background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.2);color:#34d399}
        .feedback-error{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);color:#f87171}
        .feedback-icon{font-size:1.5rem;flex-shrink:0}
        .actions{margin-top:2.5rem;display:flex;justify-content:flex-end;gap:1rem;flex-wrap:wrap}
        .btn{padding:0.85rem 1.5rem;border-radius:0.75rem;font-size:1rem;font-weight:600;cursor:pointer;border:none;transition:all 0.2s ease;font-family:'Source Serif 4',serif;white-space:nowrap}
        .btn-primary{background:#3b82f6;color:#ffffff}
        .btn-primary:hover:not(:disabled){background:#2563eb;transform:translateY(-1px)}
        .btn-primary:disabled{background:#1f2937;color:#4b5563;cursor:not-allowed}
        .btn-secondary{background:transparent;color:#9ca3af;border:1px solid #374151}
        .btn-secondary:hover{background:#1f2937;color:#ffffff}
        .progress-bar{position:absolute;bottom:0;left:0;height:4px;background:#3b82f6;transition:width 0.3s ease}
        .score-board{text-align:center;padding:3rem 1.5rem}
        .score-num{font-family:'Playfair Display',serif;font-size:3.5rem;font-weight:800;color:#3b82f6;margin-bottom:1rem}
        .score-label{font-size:1.25rem;color:#e5e7eb;margin-bottom:2rem}

        .stat-card{background:#1f2937;border:1px solid #374151;border-radius:1rem;padding:1.5rem;text-align:center}
        .stat-val{font-size:2rem;font-weight:600;color:#f3f4f6;margin-bottom:0.25rem}
        .stat-lbl{font-size:0.875rem;color:#9ca3af;text-transform:uppercase;letter-spacing:0.05em}

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            const newArray = [...array];
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [newArray[currentIndex], newArray[randomIndex]] = [newArray[randomIndex], newArray[currentIndex]];
            }
            return newArray;
        }

        function QuizApp() {
            const [started, setStarted] = React.useState(false);
            const [questions, setQuestions] = React.useState([]);
            const [currentIndex, setCurrentIndex] = React.useState(0);
            const [selectedOptions, setSelectedOptions] = React.useState([]);
            const [submitted, setSubmitted] = React.useState(false);
            const [score, setScore] = React.useState(0);
            const [wrongAnswers, setWrongAnswers] = React.useState(0);
            const [skipped, setSkipped] = React.useState(0);
            const [showResults, setShowResults] = React.useState(false);

            const startQuiz = () => {
                const shuffledQ = shuffle(quizQuestions).map(q => {
                    return {
                        ...q,
                        options: shuffle(q.options)
                    };
                });
                setQuestions(shuffledQ);
                setCurrentIndex(0);
                setSelectedOptions([]);
                setSubmitted(false);
                setScore(0);
                setWrongAnswers(0);
                setSkipped(0);
                setShowResults(false);
                setStarted(true);
            };

            const handleOptionClick = (optionId) => {
                if (submitted) return;
                setSelectedOptions([optionId]);
            };

            const handleSubmit = () => {
                if (selectedOptions.length === 0 || submitted) return;

                const currentQuestion = questions[currentIndex];
                const correctSet = new Set(currentQuestion.correct);
                const selectedSet = new Set(selectedOptions);

                const isCorrect = correctSet.size === selectedSet.size && 
                                  [...correctSet].every(id => selectedSet.has(id));

                if (isCorrect) {
                    setScore(prev => prev + 1);
                } else {
                    setWrongAnswers(prev => prev + 1);
                }
                setSubmitted(true);
            };

            const handleNext = () => {
                const totalQ = questions.length;
                if (currentIndex + 1 >= totalQ) {
                    setShowResults(true);
                } else {
                    setCurrentIndex(prev => prev + 1);
                    setSelectedOptions([]);
                    setSubmitted(false);
                }
            };

            const handleSkip = () => {
                if (submitted) return;
                setSkipped(prev => prev + 1);
                setSubmitted(true);
                setSelectedOptions([]);
            };

            if (!started) {
                return (
                    <div className="shell">
                        <div className="card" style={{textAlign:"center", padding:"3.5rem 2rem"}}>
                            <h1 className="title" style={{fontSize:"2.5rem", marginBottom:"1.5rem"}}>
                                Examen Contabilitate Financiară
                            </h1>
                            <p style={{color:"#9ca3af", fontSize:"1.2rem", lineHeight:"1.6", marginBottom:"2.5rem", maxWidth:"600px", marginInline:"auto"}}>
                                Un set de 50 de întrebări grilă bazat pe programa oficială de examinare. Ordinea întrebărilor și a răspunsurilor se amestecă la fiecare testare. Mult succes!
                            </p>
                            <button className="btn btn-primary" style={{fontSize:"1.15rem", padding:"1rem 3rem"}} onClick={startQuiz}>
                                Începe Chestionarul 🚀
                            </button>
                        </div>
                    </div>
                );
            }

            if (showResults) {
                const percentage = Math.round((score / questions.length) * 100);
                return (
                    <div className="shell">
                        <div className="card">
                            <div className="score-board">
                                <div className="score-num">{score} / {questions.length}</div>
                                <div className="score-label">Răspunsuri Corecte ({percentage}%)</div>
                                
                                <div className="stat-grid">
                                    <div className="stat-card">
                                        <div className="stat-val" style={{color:"#10b981"}}>{score}</div>
                                        <div className="stat-lbl">Corecte</div>
                                    </div>
                                    <div className="stat-card">
                                        <div className="stat-val" style={{color:"#ef4444"}}>{wrongAnswers}</div>
                                        <div className="stat-lbl">Greșite</div>
                                    </div>
                                    <div className="stat-card">
                                        <div className="stat-val" style={{color:"#f59e0b"}}>{skipped}</div>
                                        <div className="stat-lbl">Omise</div>
                                    </div>
                                </div>

                                <button className="btn btn-primary" onClick={startQuiz} style={{marginTop:"2rem"}}>
                                    Încearcă Din Nou 🔄
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            const currentQuestion = questions[currentIndex];
            const totalQ = questions.length;
            const progressPercent = ((currentIndex + 1) / totalQ) * 100;
            const canSubmit = selectedOptions.length > 0;

            return (
                <div className="shell">
                    <div className="card">
                        <div className="header">
                            <div className="header-top">
                                <span className="title">Grile Contabilitate</span>
                                <span className="meta">Q{currentIndex + 1}/{totalQ}</span>
                            </div>
                            <div className="score-display">
                                <div className="score-item">
                                    <span className="label">Corecte:</span>
                                    <span className="value">{score}</span>
                                </div>
                                <div className="score-item">
                                    <span className="label">Rămase:</span>
                                    <span className="value">{totalQ - currentIndex - 1}</span>
                                </div>
                            </div>
                        </div>

                        <div className="question-container">
                            <div className="question-text">
                                {currentQuestion.text}
                            </div>

                            <div className="options-list">
                                {currentQuestion.options.map((opt) => {
                                    const isSelected = selectedOptions.includes(opt.id);
                                    const isCorrectOpt = currentQuestion.correct.includes(opt.id);
                                    
                                    let optionClass = "option-item";
                                    if (submitted) {
                                        if (isCorrectOpt) {
                                            optionClass += " correct";
                                        } else if (isSelected) {
                                            optionClass += " incorrect";
                                        }
                                    } else if (isSelected) {
                                        optionClass += " selected";
                                    }

                                    return (
                                        <div 
                                            key={opt.id} 
                                            className={optionClass}
                                            onClick={() => handleOptionClick(opt.id)}
                                        >
                                            <div className="badge">{opt.id.toUpperCase()}</div>
                                            <div className="option-text">
                                                {opt.text}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>

                            {submitted && (() => {
                                const selectedSet = new Set(selectedOptions);
                                const correctSet = new Set(currentQuestion.correct);
                                const isCorrect = correctSet.size === selectedSet.size && 
                                                  [...correctSet].every(id => selectedSet.has(id));

                                const correctLabels = currentQuestion.correct.map(id => id.toUpperCase()).join(", ");

                                if (selectedOptions.length === 0) {
                                    return (
                                        <div className="feedback feedback-error" style={{color: "#f59e0b", background: "rgba(245,158,11,0.1)", borderColor: "rgba(245,158,11,0.2)"}}>
                                            <span className="feedback-icon">⚠️</span>
                                            <span>
                                                Ai omis această întrebare. Răspunsul corect era: <strong>{correctLabels}</strong>.
                                            </span>
                                        </div>
                                    );
                                } else if (isCorrect) {
                                    return (
                                        <div className="feedback feedback-success">
                                            <span className="feedback-icon">✓</span>
                                            <span>Excelent! Răspunsul tău este corect.</span>
                                        </div>
                                    );
                                } else {
                                    return (
                                        <div className="feedback feedback-error">
                                            <span className="feedback-icon">✗</span>
                                            <span>
                                                Răspuns greșit. Varianta corectă: <strong>{correctLabels}</strong>.
                                            </span>
                                        </div>
                                    );
                                }
                            })()}

                            <div className="actions">
                                {!submitted ? (
                                    <>
                                        <button className="btn btn-secondary" onClick={handleSkip}>
                                            Omite
                                        </button>
                                        <button className="btn btn-primary" onClick={handleSubmit} disabled={!canSubmit}>
                                            Verifică răspunsul →
                                        </button>
                                    </>
                                ) : (
                                    <button className="btn btn-primary" onClick={handleNext}>
                                        {currentIndex + 1 >= totalQ ? "Vezi rezultatele 🏁" : "Următoarea →"}
                                    </button>
                                )}
                            </div>
                        </div>
                        <div className="progress-bar" style={{width: `${progressPercent}%`}}></div>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<QuizApp/>);
    </script>
